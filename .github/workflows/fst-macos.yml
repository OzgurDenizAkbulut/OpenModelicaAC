name: OpenModelica FST macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: ['build/fst-macos-arm64']

permissions:
  contents: read

concurrency:
  group: fst-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore validated native installation
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build_cmake/fst-macos/install_cmake
          key: fst-macos15-arm64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'OMCompiler/**', 'OMEdit/**', 'OMPlot/**', '.gitmodules', 'tools/development/build-macos-distribution.sh') }}
      - name: Build and test native FST
        run: |
          set -euo pipefail
          python3 tools/development/test-macos-packaging.py
          stamp=build_cmake/fst-macos/install_cmake/fst-build-provenance.json
          if [ -f "$stamp" ]; then
            native_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_revision"])' "$stamp")
            git diff --exit-code "$native_revision" HEAD -- CMakeLists.txt cmake OMCompiler OMEdit OMPlot .gitmodules tools/development/build-macos-distribution.sh
          fi
          bash tools/development/build-macos-distribution.sh --build-only
      - name: Preserve validated native installation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build_cmake/fst-macos/install_cmake
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Package and validate relocated application
        run: |
          set -euo pipefail
          build="$PWD/build_cmake/fst-macos"
          python3 tools/development/package-macos-distribution.py --install "$build/install_cmake" --output "$build/package" --qt "$(brew --prefix qt)" 2>&1 | tee "$build/logs/package.log"
          mkdir -p "$build/distribution"
          cp "$build/package/"*.dmg "$build/package/"*.sha256 "$build/package/manifest.json" "$build/distribution/"
      - name: Upload validated disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenModelica_FST-macos-arm64
          path: build_cmake/fst-macos/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenModelica_FST-macos-arm64-evidence
          path: |
            build_cmake/fst-macos/logs/
            build_cmake/fst-macos/CMakeCache.txt
            build_cmake/fst-macos/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
