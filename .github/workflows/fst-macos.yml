name: OpenModelica FST macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: ['build/fst-macos-arm64']

permissions:
  contents: read

concurrency:
  group: fst-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, package and validate FST
        run: bash tools/development/build-macos-distribution.sh
      - name: Upload validated disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenModelica_FST-macos-arm64
          path: build_cmake/fst-macos/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenModelica_FST-macos-arm64-evidence
          path: |
            build_cmake/fst-macos/logs/
            build_cmake/fst-macos/CMakeCache.txt
            build_cmake/fst-macos/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
